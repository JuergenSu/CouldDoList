<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="description" content="Aufgaben, Termine und Gespräche für dein nächstes Ereignis.">
  <title>CouldDoList</title>
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top"><div class="frame"><a class="brand" href="./"><img src="icons/icon-32.png" width="36" height="36" alt="">CouldDoList</a></div></header>
  <div class="frame layout">
    <aside>
      <form id="name-form" class="name-form">
        <label for="sidebar-name">Dein Name</label>
        <div class="sidebar-name-controls">
          <input id="sidebar-name" name="Name" maxlength="60" autocomplete="nickname">
          <button id="save-sidebar-name" type="submit" class="secondary">Speichern</button>
          <button id="edit-sidebar-name" type="button" class="secondary name-pencil" aria-label="Deinen Namen ändern" title="Deinen Namen ändern" hidden>✎</button>
        </div>
        <p id="name-status" class="visually-hidden" role="status"></p>
      </form>
      <div class="sidebar-head"><h2>Meine Listen</h2><button type="button" id="new-list" aria-label="Neue Liste" title="Neue Liste" class="icon-button">+</button></div>
      <nav id="lists" aria-label="Aufgabenlisten"></nav>
    </aside>
    <main id="main">
      <p id="error" role="alert" hidden></p>
      <p id="status" class="visually-hidden" role="status"></p>
      <div id="content"><p>Lade Listen …</p></div>
    </main>
  </div>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <div class="dialog-head"><h2 id="create-title"></h2><button type="button" class="close" aria-label="Dialog schließen">×</button></div>
      <div id="fields"></div>
      <p class="form-error" role="alert" hidden></p>
      <button class="primary" type="submit">Speichern</button>
    </form>
  </dialog>

  <dialog id="task-dialog" aria-labelledby="task-title">
    <div class="dialog-head"><h2 id="task-title"></h2><button type="button" class="close" aria-label="Dialog schließen">×</button></div>
    <div id="task-detail"></div>
    <section class="conversation" aria-labelledby="conversation-title">
      <h3 id="conversation-title">Kommentare</h3>
      <div id="comments"></div>
      <form id="comment-form">
        <div class="comment-name">
          <label>Name (optional)<input name="Name" maxlength="60" autocomplete="nickname"></label>
          <button type="button" id="edit-comment-name" class="secondary name-pencil" aria-label="Kommentarnamen ändern" title="Kommentarnamen ändern" hidden>✎</button>
        </div>
        <label>Kommentar<textarea name="Kommentar" maxlength="2000" rows="3" required></textarea></label>
        <p class="form-error" role="alert" hidden></p>
        <button class="primary" type="submit">Kommentar hinzufügen</button>
      </form>
    </section>
  </dialog>
</body>
</html>
